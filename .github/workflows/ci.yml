name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned on purpose: an unpinned `pip install ruff` ships the newest
          # release every time, and when ruff's default rule set grew this CI
          # turned red without a single line of this repository changing.
          pip install ruff==0.17.4

      - name: Check syntax
        run: python -m compileall . -f -q

      - name: Lint with ruff
        run: ruff check .

      # unittest, not pytest: the repository root carries an __init__.py (it is
      # a Hermes plugin package), so pytest imports the root as a top-level
      # module and every test dies with "attempted relative import with no
      # known parent package".
      - name: Run tests
        run: python -m unittest discover -s tests -v
